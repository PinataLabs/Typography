name: Release

# One-click stable release of PinataLabs.Typography:
#
#   1. resolves the version from the release draft (or the version input)
#   2. rolls CHANGELOG.md's [Unreleased] section into a dated version heading
#   3. moves PublicAPI.Unshipped.txt into PublicAPI.Shipped.txt
#   4. commits that to main and tags it vX.Y.Z
#   5. calls release-publish.yml, which builds, tests, packs, publishes to NuGet, and
#      publishes the draft release notes with contributor attribution
#
# Pre-releases go through release-prerelease.yml. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0. Leave empty to use the drafted version.'
        required: false
        type: string
      dry-run:
        description: 'Dry run — resolve the version and show the changelog and API changes without tagging or publishing'
        required: false
        default: true
        type: boolean

permissions: {}

# One release at a time, stable or pre-release, and never cancel one part-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    # Needs write to push the release commit and the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases must be published from main (got $GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        # The input is passed through the environment, never interpolated into the
        # script — a workflow_dispatch input is attacker-controlled text.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"

          if [ -z "$version" ]; then
            version=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq '[.[] | select(.draft)] | .[0].tag_name // ""')
            if [ -z "$version" ]; then
              echo "::error::No release draft found — pass an explicit version input"
              exit 1
            fi
            echo "Resolved from release draft: $version"
          fi

          version=${version#v}

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a stable MAJOR.MINOR.PATCH version. Pre-releases go through the Pre-release workflow."
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # Release Drafter resolves the previous version from published GitHub
          # Releases, not from git tags. Until the first release is published it sees
          # none and drafts v0.0.1, which is below the 0.1 line MinVer is held to.
          # NuGet versions cannot be reused, so refuse anything that is not an increase
          # over the highest existing tag.
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$version" "${latest#v}" | sort -V | head -n1)" = "$version" ]; then
            echo "::error::$tag is not an increase over the latest tag $latest. If the release draft is wrong, pass an explicit version input."
            exit 1
          fi
          major=${version%%.*}
          minor=${version#*.}
          minor=${minor%%.*}
          if [ "$major" -eq 0 ] && [ "$minor" -lt 1 ]; then
            echo "::error::$tag is below 0.1.0. If the release draft reads v0.0.1 (it does until the first release is published), pass an explicit version input."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Roll changelog
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: bash .github/scripts/roll-changelog.sh "$VERSION"

      - name: Ship public API
        run: bash .github/scripts/ship-public-api.sh

      - name: Show changes
        run: git --no-pager diff

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### Dry run — nothing was published"
            echo
            echo "Would release **$TAG** with the changelog and public API changes shown in the job log."
            echo
            echo "Re-run with **dry-run** unchecked to tag and publish."
          } >> "$GITHUB_STEP_SUMMARY"

      # Pushes straight to main with GITHUB_TOKEN. The "Main" ruleset is disabled today;
      # if it is enabled, add GitHub Actions to its bypass list or this push fails.
      # One atomic push, so main never gets the release commit without its tag.
      - name: Commit and tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md src/PinataLabs.Typography/PublicAPI.Shipped.txt src/PinataLabs.Typography/PublicAPI.Unshipped.txt
          git commit -m "chore: release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "$TAG"

  publish:
    name: Publish
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/release-publish.yml
    with:
      kind: stable
      tag: ${{ needs.prepare.outputs.tag }}
      dry-run: false
    permissions:
      contents: write
      id-token: write
    secrets: inherit
