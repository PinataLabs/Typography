name: Build and Test

# Markdown files and the documentation website are not inputs to the .NET build, so a change
# that touches only those files skips this workflow. The Docs workflow builds docs-website/.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs-website/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs-website/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v5

      # global.json pins the .NET 11 SDK, which carries only the net11.0 runtime.
      # The 8.0 and 10.0 entries install the runtimes the net8.0 and net10.0 tests need.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore PinataLabs.Typography.slnx

      - name: Build
        id: build
        run: dotnet build PinataLabs.Typography.slnx -c Release --no-restore

      # global.json selects Microsoft.Testing.Platform, so dotnet test runs TUnit natively.
      - name: Test net8.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --solution PinataLabs.Typography.slnx -c Release -f net8.0 --no-build

      - name: Test net10.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --solution PinataLabs.Typography.slnx -c Release -f net10.0 --no-build

      - name: Test net11.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --solution PinataLabs.Typography.slnx -c Release -f net11.0 --no-build
